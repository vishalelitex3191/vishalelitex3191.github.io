<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA STORE PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body { background: #020617; color: white; font-family: 'Orbitron', sans-serif; padding-bottom: 100px; }
        .page { display: none; } .active-page { display: block !important; }
        .glass { background: #0f172a; border: 1px solid #334155; border-radius: 20px; position: relative; overflow: hidden; }
        .glass::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transform: skewX(-25deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }
        .fs-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .nav-btn.active { color: #eab308; }
        .vip-tag { position: absolute; top: 5px; right: 5px; background: gold; color: black; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 5px; z-index: 10; }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="auth-screen" class="fixed inset-0 bg-[#020617] z-[999] flex items-center justify-center p-6"><div class="w-full max-w-sm glass p-8 border"><h1 id="auth-title" class="text-3xl font-black text-yellow-500 mb-6 text-center italic">LOGIN</h1><input type="text" id="r-name" placeholder="Name" class="hidden w-full p-4 bg-black rounded-xl mb-3 border"><input type="email" id="l-email" placeholder="Email" class="w-full p-4 bg-black rounded-xl mb-3 border"><input type="password" id="l-pass" placeholder="Password" class="w-full p-4 bg-black rounded-xl mb-3 border"><button id="main-btn" onclick="processAuth()" class="w-full py-4 bg-yellow-500 text-black font-black rounded-xl italic">LOGIN</button><p class="text-center cursor-pointer mt-4" onclick="toggleAuth()">Switch Mode: <span id="mode-text" class="text-yellow-500 font-bold">Register</span></p></div></div>
    
    <!-- Modal -->
    <div id="app-modal" class="fixed inset-0 bg-black/95 z-[900] hidden p-4 overflow-y-auto"><div class="glass max-w-sm mx-auto mt-10 p-8 border border-yellow-500/30"><button onclick="document.getElementById('app-modal').classList.add('hidden')" class="float-right text-2xl text-white">✕</button><img id="m-logo" class="w-24 h-24 rounded-2xl mx-auto mb-4 border"><h2 id="m-name" class="text-xl font-black text-center mb-2 italic"></h2><p id="m-desc" class="text-md text-yellow-400 font-bold text-center mb-6 italic border-b border-yellow-500/30 pb-4"></p><div id="m-screens" class="grid grid-cols-2 gap-3 mb-6"></div><button id="m-link" onclick="handleAction()" class="w-full py-4 bg-yellow-500 text-black font-black rounded-xl italic text-lg shadow-lg"></button></div></div>
    
    <main class="p-4 pt-10 max-w-lg mx-auto">
        <div class="glass p-4 mb-6 text-center border border-yellow-500/30"><a id="video-btn" href="#" target="_blank" class="text-yellow-500 font-bold italic tracking-widest"><i class="fas fa-play-circle"></i> WATCH DOWNLOAD VIDEO</a></div>
        <section id="page-pro" class="page active-page"><h2 class="font-bold mb-4 text-yellow-500 italic uppercase">✨ Pro Apps</h2><div id="pro-list" class="grid grid-cols-2 gap-4"></div></section>
        <section id="page-vip" class="page"><h2 class="font-bold mb-4 text-yellow-500 italic uppercase">👑 Vip Store</h2><div id="vip-list" class="grid grid-cols-2 gap-4"></div></section>
        <section id="page-wallet" class="page"><div class="glass p-8 text-center border border-yellow-500 mb-6"><p class="text-[10px] opacity-70">BALANCE</p><span id="wallet-amt" class="text-5xl font-black italic text-yellow-500">₹0</span></div><div class="glass p-6 mb-6"><img id="qr-img" class="w-full rounded-lg mb-4 border"><p id="upi-text" class="text-xs text-center font-bold mb-4 bg-black p-3 rounded border"></p><div class="grid grid-cols-3 gap-3 mb-6"><div class="bg-black p-3 rounded border text-center" onclick="payRedirect('phonepe')"><img src="https://i.ibb.co/PG08sG3c/20260511-030931.png" class="w-8 mx-auto"></div><div class="bg-black p-3 rounded border text-center" onclick="payRedirect('gpay')"><img src="https://img.icons8.com/color/48/google-pay.png" class="w-8 mx-auto"></div><div class="bg-black p-3 rounded border text-center" onclick="payRedirect('paytm')"><img src="https://img.icons8.com/color/48/paytm.png" class="w-8 mx-auto"></div></div><input type="number" id="dep-amt" placeholder="Amount" class="w-full p-4 bg-black rounded-xl mb-3 border"><input type="text" id="dep-utr" placeholder="12 Digit UTR" class="w-full p-4 bg-black rounded-xl mb-4 border"><button onclick="deposit()" class="w-full py-4 bg-blue-600 rounded-xl font-black italic">SUBMIT DEPOSIT</button></div><div class="glass p-6"><h3 class="font-bold mb-3 border-b pb-2 italic text-yellow-500">History</h3><div id="history-list" class="space-y-3"></div></div></section>
        <section id="page-profile" class="page"><div class="glass p-10 text-center mb-6"><div class="text-6xl mb-4 text-yellow-500">👤</div><p id="user-name" class="text-xl font-black italic"></p><p id="user-email" class="text-xs text-slate-400"></p></div><a id="help-link" href="#" class="glass p-5 mb-2 flex justify-between font-bold italic">SUPPORT <i class="fas fa-headset text-yellow-500"></i></a><a id="rec-link" href="#" class="glass p-5 flex justify-between font-bold italic">RECOVERY <i class="fas fa-fingerprint text-yellow-500"></i></a><button onclick="auth.signOut().then(()=>location.reload())" class="w-full py-3 bg-red-600 rounded-xl mt-6 font-black">LOGOUT</button></section>
    </main>
    <nav class="fixed bottom-0 w-full flex justify-around p-4 bg-[#020617]/95 border-t border-slate-800 z-50 backdrop-blur-md"><button onclick="showPage('page-pro', this)" class="nav-btn active"><i class="fas fa-th-large text-xl"></i></button><button onclick="showPage('page-vip', this)" class="nav-btn"><i class="fas fa-crown text-xl"></i></button><button onclick="showPage('page-wallet', this)" class="nav-btn"><i class="fas fa-wallet text-xl"></i></button><button onclick="showPage('page-profile', this)" class="nav-btn"><i class="fas fa-user text-xl"></i></button></nav>

    <script>
        const db=firebase.initializeApp({apiKey:"AIzaSyAH_wUmMgK4M5TgtrG4Vftr80DL-6AMb0c",databaseURL:"https://premium-store-d65ee-default-rtdb.firebaseio.com",projectId:"premium-store-d65ee"}).database();
        const auth=firebase.auth();
        function showPage(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active-page');btn.classList.add('active');}
        function toggleAuth(){const i=document.getElementById('r-name').classList.toggle('hidden');document.getElementById('auth-title').innerText=i?"LOGIN":"REGISTER";document.getElementById('main-btn').innerText=i?"LOGIN":"REGISTER";document.getElementById('mode-text').innerText=i?"Register":"Login";}
        function showFull(url){const d=document.createElement('div');d.className='fs-overlay';d.innerHTML=`<button class="absolute top-5 right-5 text-5xl text-white" onclick="this.parentElement.remove()">✕</button><img src="${url}">`;document.body.appendChild(d);}
        function payRedirect(app){const amt=document.getElementById('dep-amt').value||10;const upi=document.getElementById('upi-text').innerText.replace('UPI: ','');const u=app==='phonepe'?`phonepe://pay?pa=${upi}&am=${amt}`:app==='gpay'?`tez://upi/pay?pa=${upi}&am=${amt}`:`paytmmp://pay?pa=${upi}&am=${amt}`;window.location.href=u;}
        async function deposit(){const a=document.getElementById('dep-amt').value, u=document.getElementById('dep-utr').value;if(!a || !/^\d{12}$/.test(u)) return alert("WRONG 12 Digit UTR Required");const s=await db.ref('deposits').orderByChild('utr').equalTo(u).once('value');if(s.exists())return alert("UTR Used!");db.ref('deposits').push({uid:auth.currentUser.uid,amount:a,utr:u,status:'pending'});alert("Submitted!");}
        async function processAuth(){const e=document.getElementById('l-email').value, p=document.getElementById('l-pass').value, n=document.getElementById('r-name').value;try{if(document.getElementById('auth-title').innerText==="LOGIN") await auth.signInWithEmailAndPassword(e,p); else { const c=await auth.createUserWithEmailAndPassword(e,p); await db.ref('users/'+c.user.uid).set({username:n,wallet:0}); } location.reload();}catch(e){alert(e.message);}}
        function openApp(id){db.ref('apps/'+id).once('value',s=>{const a=s.val();window.tempData={id,type:a.type,price:a.price,link:a.link};document.getElementById('m-name').innerText=a.name;document.getElementById('m-desc').innerText=a.desc;document.getElementById('m-logo').src=a.logo;document.getElementById('app-modal').classList.remove('hidden');db.ref('users/'+auth.currentUser.uid+'/purchasedApps/'+id).once('value',p=>{document.getElementById('m-link').innerText=(a.type==='PRO'||p.exists())?"DOWNLOAD":"BUY ₹1̶9̶9̶ ₹"+a.price;});const sc=document.getElementById('m-screens');sc.innerHTML='';if(a.screens)a.screens.forEach(u=>sc.innerHTML+=`<img src="${u}" class="rounded-lg h-24 w-full border" onclick="showFull('${u}')">`);});}
        function handleAction(){db.ref('apps/'+window.tempData.id).once('value',s=>{const p=Number(window.tempData.price);db.ref('users/'+auth.currentUser.uid).once('value',u=>{if(window.tempData.type==='PRO'||u.val().purchasedApps?.[window.tempData.id]){db.ref('apps/'+window.tempData.id+'/downloads').transaction(c=>(c||0)+1);window.open(window.tempData.link,'_blank');}else if((u.val().wallet||0)>=p){db.ref('users/'+auth.currentUser.uid).update({wallet:u.val().wallet-p});db.ref('users/'+auth.currentUser.uid+'/purchasedApps/'+window.tempData.id).set(true);db.ref('apps/'+window.tempData.id+'/downloads').transaction(c=>(c||0)+1);alert("Congratulations 🎉! Success");window.open(window.tempData.link,'_blank');}else alert("Low Balance please deposit and buy!");});});}
        auth.onAuthStateChanged(u=>{if(u){document.getElementById('auth-screen').classList.add('hidden');db.ref('users/'+u.uid).on('value',s=>{const d=s.val()||{};document.getElementById('wallet-amt').innerText='₹'+(d.wallet||0);document.getElementById('user-email').innerText=u.email;document.getElementById('user-name').innerText=d.username||"User";});db.ref('deposits').on('value',s=>{const h=document.getElementById('history-list');h.innerHTML='';s.forEach(snap=>{const d=snap.val();if(d.uid===u.uid){const col=d.status==='approved'?'text-green-500':'text-yellow-500';h.innerHTML+=`<div class="glass p-3 flex justify-between text-xs"><span>₹${d.amount}|UTR:${d.utr}</span><span class="${col}">${d.status.toUpperCase()}</span></div>`;}});});db.ref('settings').on('value',s=>{const d=s.val()||{};document.getElementById('qr-img').src=d.qrCodeUrl||'';document.getElementById('upi-text').innerText="UPI: "+(d.adminUpi||'');document.getElementById('video-btn').href=d.setupVideo||'#';document.getElementById('help-link').href=d.helpLink||'#';document.getElementById('rec-link').href=d.recEmail||'#';});db.ref('apps').on('value',s=>{const pro=document.getElementById('pro-list'),vip=document.getElementById('vip-list');pro.innerHTML='';vip.innerHTML='';s.forEach(snap=>{const a=snap.val();const html=`<div class="glass p-3 relative" onclick="openApp('${snap.key}')">${a.type==='VIP'?'<span class="vip-tag">VIP</span>':''}<img src="${a.logo}" class="rounded-xl w-full aspect-square mb-2"><h3 class="text-xs text-center">${a.name}</h3></div>`;a.type==='PRO'?pro.innerHTML+=html:vip.innerHTML+=html;});});}});
    </script>
</body>
</html>
